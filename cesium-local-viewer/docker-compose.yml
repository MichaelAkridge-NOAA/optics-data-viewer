version: "3.8"

services:
  viewer:
    image: nginx:1.27-alpine
    container_name: cesium-3tz-viewer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app:/usr/share/nginx/html:ro
      - ./data:/usr/share/nginx/data:ro
    restart: unless-stopped
