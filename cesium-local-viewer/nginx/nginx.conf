events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Allow large range requests needed by .3tz archives
    proxy_max_temp_file_size 0;

    server {
        listen 80;
        server_name localhost;

        # Serve the CesiumJS web app
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # Serve .3tz and other data files with full range-request support
        # Nginx enables Accept-Ranges: bytes by default for static files,
        # which is required for CesiumJS to stream within a .3tz archive.
        location /data/ {
            alias /usr/share/nginx/data/;

            # Enable directory listing in JSON format so the UI can discover files
            autoindex on;
            autoindex_format json;

            # CORS headers so the browser JS can fetch from the same origin
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;

            # Handle OPTIONS pre-flight
            if ($request_method = OPTIONS) {
                return 204;
            }
        }
    }
}
