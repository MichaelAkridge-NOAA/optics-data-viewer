<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Optical Products - NOAA Optics SI Data Portal</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{--bg:#0b1220;--card:#121a2b;--text:#e8eefc;--muted:#9fb0d0;--ring:rgba(255,255,255,.08);--accent:#2b79ff}
    *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .wrap{max-width:1200px;margin:0 auto;padding:40px 20px}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
    h1{margin:0 0 4px;font-weight:800;letter-spacing:.2px} p.lead{margin:0;color:var(--muted)}
    .breadcrumb{margin:0 0 20px;font-size:14px}.breadcrumb a{color:var(--accent);text-decoration:none}.breadcrumb a:hover{text-decoration:underline}
    .stats-bar{display:flex;gap:20px;margin:20px 0;padding:16px;background:var(--card);border-radius:10px;border:1px solid var(--ring);flex-wrap:wrap}
    .stat{text-align:center}.stat-number{font-size:24px;font-weight:800;color:var(--accent)}.stat-label{font-size:12px;color:var(--muted)}
    .controls{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}
    .control-group{display:flex;flex-direction:column;gap:4px}.control-group label{font-size:12px;color:var(--muted);font-weight:600}
    .control-group select,.control-group input{background:var(--card);color:var(--text);border:1px solid var(--ring);border-radius:6px;padding:6px 10px;font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:24px}
    .card{background:var(--card);border-radius:14px;border:1px solid var(--ring);overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
    .card-header{position:relative;height:160px;overflow:hidden}
    .thumbnail{width:100%;height:100%;object-fit:cover;background:linear-gradient(135deg,#1a365d 0%,#2563eb 50%,#3b82f6 100%)}
    .product-type-badge{position:absolute;top:8px;right:8px;padding:4px 8px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
    .badge-dem{background:rgba(168,85,247,.9);color:#fff}.badge-ortho{background:rgba(34,197,94,.9);color:#fff}
    .region-badge{position:absolute;top:8px;left:8px;padding:2px 6px;border-radius:8px;font-size:10px;background:rgba(0,0,0,.7);color:#fff}
    .body{padding:14px 16px}.title{margin:0 0 4px;font-size:16px;font-weight:700;line-height:1.2}
    .meta{color:var(--muted);font-size:12px;margin:4px 0 8px}.meta-item{display:inline-block;margin-right:12px}
    .description{font-size:13px;color:var(--muted);margin:8px 0 12px;line-height:1.4}
    .actions{display:flex;gap:8px;margin-top:auto}
    .btn{display:inline-block;padding:6px 12px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:600;border:1px solid var(--ring);color:var(--text);text-align:center}
    .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:hover{opacity:.9}
    .loading{text-align:center;padding:40px;color:var(--muted)} .spinner{width:24px;height:24px;border:2px solid var(--ring);border-top:2px solid var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
    @keyframes spin{to{transform:rotate(360deg)}}
    footer{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}
    .charts{display:flex;gap:40px;margin:40px 0} canvas{border-radius:10px;box-shadow:0 4px 8px rgba(0,0,0,.1)}
    dialog{border:none;border-radius:16px;max-width:980px;width:90vw;background:var(--card);color:var(--text);padding:0}
    .modal-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ring)}
    .modal-body{display:grid;grid-template-columns:1fr 360px;gap:12px;padding:12px;max-height:80vh;overflow:auto}
    .modal-body img{width:100%;height:auto;border-radius:10px}
    .kv{font-size:13px;color:var(--muted)} .kv div{margin:4px 0} .kv strong{color:var(--text)}
  </style>

  <!-- Load Chart.js first; defer preserves order -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>

  <script defer>
  // --------- CONFIG ----------
  const BASE = "https://storage.googleapis.com/nmfs_odp_pifsc/PIFSC/ESD/ARP/data_management/dataset_index/optical-products/vital-rates";
  const URLS = {
    base: BASE,
    index:   BASE + "/index.json",
    summary: BASE + "/summary.json"
  };

  // --------- DOM GETTERS ----------
  const els = {
    loading:  () => document.getElementById("loading"),
    grid:     () => document.getElementById("products-grid"),
    statsBar: () => document.getElementById("stats"),
    totalProducts: () => document.getElementById("total-products"),
    totalDems:     () => document.getElementById("total-dems"),
    totalOrthos:   () => document.getElementById("total-orthos"),
    totalSize:     () => document.getElementById("total-size"),
    filters: {
      type:   () => document.getElementById("type-filter"),
      region: () => document.getElementById("region-filter"),
      island: () => document.getElementById("island-filter"),
      year:   () => document.getElementById("year-filter"),
    },
    chartsWrap: () => document.querySelector(".charts")
  };

  // --------- STATE ----------
  let ALL_PRODUCTS = [];
  let SUMMARY = null;

  // --------- HELPERS ----------
  async function getJSON(url){
    const res = await fetch(url, {method:"GET", mode:"cors", cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status+" for "+url);
    return res.json();
  }
  function show(el){ el.style.display = ""; }
  function hide(el){ el.style.display = "none"; }
  function formatSize(bytes){
    if(!bytes && bytes!==0) return "N/A";
    const u=["B","KB","MB","GB","TB"]; let i=0, n=+bytes;
    while(n>=1024 && i<u.length-1){ n/=1024; i++; }
    return n.toFixed(n<10 && i>0 ? 1 : 0)+" "+u[i];
  }

  // URL helpers to avoid previews/previews and %2F issues
  const isFullUrl = (s) => typeof s === "string" && /^https?:\/\//i.test(s);
  const stripLeadingSlash = (s) => (s || "").replace(/^\/+/, "");
  const join = (a, b) => a.replace(/\/+$/,"") + "/" + stripLeadingSlash(b || "");
  function encodeLastSegment(pathLike){
    const rel = stripLeadingSlash(pathLike || "");
    const parts = rel.split("/");
    if (parts.length === 1) return encodeURIComponent(parts[0]);
    const file = parts.pop();
    return parts.join("/") + "/" + encodeURIComponent(file);
  }
  function toUrl(kind, value){
    if (!value) return "";
    if (isFullUrl(value)) return value;
    let rel = stripLeadingSlash(value);
    if (/^(previews|thumbnails|items)\//i.test(rel)) {
      return join(URLS.base, encodeLastSegment(rel));
    }
    let folder = "";
    if (kind === "thumb") folder = "thumbnails";
    else if (kind === "prev") folder = "previews";
    else if (kind === "item") folder = "items";
    return join(join(URLS.base, folder), encodeLastSegment(rel));
  }

  function populateFilters(products){
    const addOpts = (select, values) => {
      const frag = document.createDocumentFragment();
      [...values].sort((a,b)=>String(a).localeCompare(String(b))).forEach(v=>{
        const o=document.createElement("option"); o.value=String(v); o.textContent=String(v); frag.appendChild(o);
      });
      const label = select.dataset.all || "All";
      select.innerHTML = "";
      select.appendChild(new Option(label, "all"));
      select.appendChild(frag);
    };
    addOpts(els.filters.region(), new Set(products.map(p=>p.region_code).filter(Boolean)));
    addOpts(els.filters.island(), new Set(products.map(p=>p.island_code).filter(Boolean)));
    addOpts(els.filters.year(),   new Set(products.map(p=>p.year).filter(Boolean)));
  }

  function applyFilters(){
    const type   = els.filters.type().value;
    const region = els.filters.region().value;
    const island = els.filters.island().value;
    const year   = els.filters.year().value;
    return ALL_PRODUCTS.filter(p => {
      if(type!=="all"   && p.product_type !== type) return false;
      if(region!=="all" && String(p.region_code)!==region) return false;
      if(island!=="all" && String(p.island_code)!==island) return false;
      if(year!=="all"   && String(p.year)!==year) return false;
      return true;
    });
  }

  function renderProducts(products){
    const grid = els.grid();
    grid.innerHTML = products.map(p => {
      const thumb   = toUrl("thumb", p.thumbnail);
      const preview = toUrl("prev",  p.large_preview);
      const itemJsonPath = p.item_path ? toUrl("item", p.item_path)
                                       : toUrl("item", (p.id + ".json"));
      const badgeCls = p.product_type === "dem" ? "badge-dem" : "badge-ortho";

      return `
      <div class="card" data-id="${p.id}">
        <div class="card-header">
          ${thumb
            ? `<img src="${thumb}" alt="${p.title||''}" class="thumbnail"
                   onerror="this.remove(); this.parentElement.insertAdjacentHTML('beforeend','<div class=&quot;thumbnail&quot;></div>');">`
            : `<div class="thumbnail"></div>`
          }
          <div class="region-badge">${p.region_code || ""}</div>
          <div class="product-type-badge ${badgeCls}">${(p.product_type||"").toUpperCase()}</div>
        </div>
        <div class="body">
          <div class="title">${p.title || (p.site_code||"")}</div>
          <div class="meta">
            <span class="meta-item">📍 ${p.island_code || ""}</span>
            <span class="meta-item">📅 ${p.year || ""}</span>
            <span class="meta-item">📏 ${p.size_human || "N/A"}</span>
          </div>
          <div class="description">${p.region || ""} • Site: ${p.site_code || ""}</div>
          <div class="actions" onclick="event.stopPropagation()">
            <a class="btn" href="${itemJsonPath}" target="_blank" rel="noopener">Details JSON</a>
            ${preview ? `<a class="btn btn-primary" href="${preview}" target="_blank" rel="noopener">Preview</a>` : ``}
            <button class="btn" data-view="${p.id}">View Here</button>
          </div>
        </div>
      </div>`;
    }).join("");

    grid.querySelectorAll(".card").forEach(card=>{
      card.addEventListener("click", ()=> openViewer(card.dataset.id));
      card.querySelectorAll("[data-view]").forEach(btn=>{
        btn.addEventListener("click", (e)=>{ e.preventDefault(); openViewer(btn.getAttribute("data-view")); });
      });
    });

    show(grid);
  }

  function renderStats(summary){
    els.totalProducts().textContent = summary.total || 0;
    els.totalDems().textContent     = summary.by_type?.dem ?? 0;
    els.totalOrthos().textContent   = summary.by_type?.ortho ?? 0;
    els.totalSize().textContent     = formatSize(summary.total_size_bytes);
    show(els.statsBar());
  }

  function renderCharts(summary){
    const chartsWrap = els.chartsWrap();
    const ctx1 = document.getElementById("chart-by-type").getContext("2d");
    const ctx2 = document.getElementById("chart-by-year").getContext("2d");

    new Chart(ctx1, {
      type: "pie",
      data: { labels: ["DEM","Ortho"], datasets: [{ data: [summary.by_type?.dem||0, summary.by_type?.ortho||0] }] },
      options: { plugins: { legend: { position: "bottom" } } }
    });

    const byYear = summary.by_year || {};
    new Chart(ctx2, {
      type: "bar",
      data: { labels: Object.keys(byYear), datasets: [{ label: "Products by Year", data: Object.values(byYear) }] },
      options: { responsive: true, plugins: { legend: { display: false } } }
    });

    show(chartsWrap);
  }

  async function openViewer(id){
    try{
      // Prefer item_path if provided in index.json
      const p = ALL_PRODUCTS.find(x => String(x.id) === String(id)) || {};
      const itemUrl = p.item_path ? toUrl("item", p.item_path)
                                  : toUrl("item", (id + ".json"));
      const item = await getJSON(itemUrl);

      const previewUrl = toUrl("prev", p.large_preview) || toUrl("thumb", p.thumbnail);

      const dlg = document.getElementById("viewer");
      dlg.querySelector(".m-title").textContent = item.title || p.title || (p.site_code || "");
      dlg.querySelector(".m-img").src = previewUrl || "";
      dlg.querySelector(".m-json").href = itemUrl;
      dlg.querySelector(".m-preview").href = previewUrl || "#";

      const kv = dlg.querySelector(".kv");
      kv.innerHTML = `
        <div><strong>Region:</strong> ${p.region||""} (${p.region_code||""})</div>
        <div><strong>Island:</strong> ${p.island_code||""}</div>
        <div><strong>Site:</strong> ${p.site_code||""}</div>
        <div><strong>Year:</strong> ${p.year||""}</div>
        <div><strong>Type:</strong> ${p.product_type||""}</div>
        <div><strong>Size:</strong> ${p.size_human||"N/A"}</div>
      `;
      dlg.showModal();
    }catch(err){
      alert("Could not load item details: " + err.message);
    }
  }

  async function init(){
    const loading = els.loading();
    const grid = els.grid();

    try{
      const [index, summary] = await Promise.all([getJSON(URLS.index), getJSON(URLS.summary)]);
      ALL_PRODUCTS = Array.isArray(index) ? index : [];
      SUMMARY = summary || {};

      populateFilters(ALL_PRODUCTS);
      renderProducts(ALL_PRODUCTS);
      renderStats(SUMMARY);
      renderCharts(SUMMARY);

      hide(loading); show(grid);
    }catch(err){
      console.error(err);
      loading.innerHTML = `
        <div style="color:#ef4444">
          <strong>Error Loading Data</strong><br>
          ${err.message}<br>
          Check that JSON/preview/thumbnail paths are public and CORS-enabled.
        </div>`;
    }

    ["type","region","island","year"].forEach(k=>{
      els.filters[k]().addEventListener("change", ()=>{
        const filtered = applyFilters();
        renderProducts(filtered);
      });
    });
  }

  document.addEventListener("DOMContentLoaded", init);
  </script>
</head>
<body>
  <div class="wrap">
    <div class="breadcrumb"><a href="../">← Back to Portal</a></div>
    <header>
      <div>
        <h1>Optical Products</h1>
        <p class="lead">Digital Elevation Models (DEMs) and orthomosaics from Pacific coral reef monitoring sites.</p>
      </div>
    </header>

    <div class="stats-bar" id="stats" style="display:none;">
      <div class="stat"><div class="stat-number" id="total-products">0</div><div class="stat-label">Total Products</div></div>
      <div class="stat"><div class="stat-number" id="total-dems">0</div><div class="stat-label">DEMs</div></div>
      <div class="stat"><div class="stat-number" id="total-orthos">0</div><div class="stat-label">Orthomosaics</div></div>
      <div class="stat"><div class="stat-number" id="total-size">0</div><div class="stat-label">Total Size</div></div>
    </div>

    <div class="controls">
      <div class="control-group"><label>Product Type:</label>
        <select id="type-filter" data-all="All Types">
          <option value="all">All Types</option>
          <option value="dem">DEMs</option>
          <option value="ortho">Orthomosaics</option>
        </select>
      </div>
      <div class="control-group"><label>Region:</label>
        <select id="region-filter" data-all="All Regions"><option value="all">All Regions</option></select>
      </div>
      <div class="control-group"><label>Island:</label>
        <select id="island-filter" data-all="All Islands"><option value="all">All Islands</option></select>
      </div>
      <div class="control-group"><label>Year:</label>
        <select id="year-filter" data-all="All Years"><option value="all">All Years</option></select>
      </div>
    </div>

    <div class="loading" id="loading"><div class="spinner"></div><div>Loading optical products...</div></div>

    <div class="grid" id="products-grid" style="display:none;"></div>

    <div class="charts" style="display:none;">
      <canvas id="chart-by-type" width="400" height="400"></canvas>
      <canvas id="chart-by-year" width="400" height="400"></canvas>
    </div>

    <footer>2025 | NOAA Fisheries - Optics SI - PIFSC | <a href="../" style="color: var(--accent);">Return to Portal</a></footer>
  </div>

  <!-- Viewer modal -->
  <dialog id="viewer">
    <div class="modal-header">
      <strong class="m-title">Viewer</strong>
      <div>
        <a class="btn m-json" href="#" target="_blank" rel="noopener">Item JSON</a>
        <a class="btn btn-primary m-preview" href="#" target="_blank" rel="noopener">Open Preview</a>
        <button class="btn" onclick="document.getElementById('viewer').close()">Close</button>
      </div>
    </div>
    <div class="modal-body">
      <img class="m-img" alt="Preview"/>
      <div>
        <div class="kv"></div>
      </div>
    </div>
  </dialog>
</body>
</html>
