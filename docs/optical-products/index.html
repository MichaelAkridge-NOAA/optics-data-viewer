<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Optical Products - NOAA Optics SI Data Portal</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { --bg:#0b1220; --card:#121a2b; --text:#e8eefc; --muted:#9fb0d0; --ring:rgba(255,255,255,.08); --accent:#2b79ff; }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .wrap{max-width:1200px;margin:0 auto;padding:40px 20px}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
    h1{margin:0 0 4px;font-weight:800;letter-spacing:.2px}
    p.lead{margin:0;color:var(--muted)}
    .breadcrumb{margin:0 0 20px;font-size:14px}
    .breadcrumb a{color:var(--accent);text-decoration:none}
    .breadcrumb a:hover{text-decoration:underline}
    .stats-bar{display:flex;gap:20px;margin:20px 0;padding:16px;background:var(--card);border-radius:10px;border:1px solid var(--ring);flex-wrap:wrap}
    .stat{text-align:center}
    .stat-number{font-size:24px;font-weight:800;color:var(--accent)}
    .stat-label{font-size:12px;color:var(--muted)}
    .controls{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}
    .control-group{display:flex;flex-direction:column;gap:4px}
    .control-group label{font-size:12px;color:var(--muted);font-weight:600}
    .control-group select{background:var(--card);color:var(--text);border:1px solid var(--ring);border-radius:6px;padding:6px 10px;font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:24px}
    .card{background:var(--card);border-radius:14px;border:1px solid var(--ring);overflow:hidden;display:flex;flex-direction:column}
    .card-header{position:relative;height:160px;overflow:hidden}
    .thumbnail{width:100%;height:100%;object-fit:cover;background:linear-gradient(135deg,#1a365d 0%,#2563eb 50%,#3b82f6 100%)}
    .product-type-badge{position:absolute;top:8px;right:8px;padding:4px 8px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
    .badge-dem{background:rgba(168,85,247,0.9);color:white}
    .badge-ortho{background:rgba(34,197,94,0.9);color:white}
    .region-badge{position:absolute;top:8px;left:8px;padding:2px 6px;border-radius:8px;font-size:10px;background:rgba(0,0,0,0.7);color:white}
    .body{padding:14px 16px}
    .title{margin:0 0 4px;font-size:16px;font-weight:700;line-height:1.2}
    .meta{color:var(--muted);font-size:12px;margin:4px 0 8px}
    .meta-item{display:inline-block;margin-right:12px}
    .description{font-size:13px;color:var(--muted);margin:8px 0 12px;line-height:1.4}
    .actions{display:flex;gap:8px;margin-top:auto}
    .btn{display:inline-block;padding:6px 12px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:600;border:1px solid var(--ring);color:var(--text);text-align:center}
    .btn-primary{background:var(--accent);border-color:var(--accent);color:white}
    .btn:hover{opacity:0.9}
    .loading{text-align:center;padding:40px;color:var(--muted)}
    .spinner{width:24px;height:24px;border:2px solid var(--ring);border-top:2px solid var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
    @keyframes spin{to{transform:rotate(360deg)}}
    footer{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}
    .charts{display:flex;gap:40px;margin:40px 0}
    canvas{border-radius:10px;box-shadow:0 4px 8px rgba(0,0,0,0.1)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="breadcrumb">
      <a href="../">← Back to Portal</a>
    </div>

    <header>
      <div>
        <h1>Optical Products</h1>
        <p class="lead">Digital Elevation Models (DEMs) and orthomosaics from Pacific coral reef monitoring sites.</p>
      </div>
    </header>

    <div class="stats-bar" id="stats" style="display:none;">
      <div class="stat">
        <div class="stat-number" id="total-products">0</div>
        <div class="stat-label">Total Products</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="total-dems">0</div>
        <div class="stat-label">DEMs</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="total-orthos">0</div>
        <div class="stat-label">Orthomosaics</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="total-size">0</div>
        <div class="stat-label">Total Size</div>
      </div>
    </div>

    <div class="controls">
      <div class="control-group">
        <label>Product Type:</label>
        <select id="type-filter">
          <option value="all">All Types</option>
          <option value="dem">DEMs</option>
          <option value="ortho">Orthomosaics</option>
        </select>
      </div>
      <div class="control-group">
        <label>Region:</label>
        <select id="region-filter">
          <option value="all">All Regions</option>
        </select>
      </div>
      <div class="control-group">
        <label>Island:</label>
        <select id="island-filter">
          <option value="all">All Islands</option>
        </select>
      </div>
      <div class="control-group">
        <label>Year:</label>
        <select id="year-filter">
          <option value="all">All Years</option>
        </select>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>Loading optical products...</div>
    </div>

    <div class="grid" id="products-grid" style="display:none;"></div>

    <div class="charts" style="display:none;">
      <canvas id="chart-by-type" width="400" height="400"></canvas>
      <canvas id="chart-by-year" width="400" height="400"></canvas>
    </div>

    <footer>
      2025 | NOAA Fisheries - Optics SI - PIFSC | <a href="../" style="color: var(--accent);">Return to Portal</a>
    </footer>
  </div>

  <script>
    async function fetchData() {
        try {
            const indexResponse = await fetch('https://storage.googleapis.com/nmfs_odp_pifsc/PIFSC/ESD/ARP/data_management/dataset_index/optical-products/vital-rates/index.json');
            const summaryResponse = await fetch('https://storage.googleapis.com/nmfs_odp_pifsc/PIFSC/ESD/ARP/data_management/dataset_index/optical-products/vital-rates/summary.json');

            if (!indexResponse.ok || !summaryResponse.ok) {
                throw new Error('Failed to fetch data files');
            }

            const allProducts = await indexResponse.json();
            const summary = await summaryResponse.json();

            renderProducts(allProducts);
            renderCharts(summary);
        } catch (error) {
            console.error('Error fetching data:', error);
            document.getElementById('loading').innerHTML = `
                <div style="color: #ef4444;">
                    <strong>Error Loading Data</strong><br>
                    Unable to load optical products or summary. Please check the data files.
                </div>
            `;
        }
    }

    function renderProducts(products) {
        const grid = document.getElementById('products-grid');
        grid.innerHTML = products.map(product => `
            <div class="card">
                <div class="card-header">
                    ${product.thumbnail ? 
                        `<img src="https://storage.googleapis.com/nmfs_odp_pifsc/PIFSC/ESD/ARP/data_management/dataset_index/optical-products/vital-rates/thumbnails/${product.thumbnail}" alt="${product.title}" class="thumbnail" onerror="this.style.display='none'">` :
                        '<div class="thumbnail"></div>'
                    }
                    <div class="region-badge">${product.region_code}</div>
                    <div class="product-type-badge badge-${product.product_type}">
                        ${product.product_type.toUpperCase()}
                    </div>
                </div>
                <div class="body">
                    <div class="title">${product.title}</div>
                    <div class="meta">
                        <span class="meta-item">📍 ${product.island_code}</span>
                        <span class="meta-item">📅 ${product.year}</span>
                        <span class="meta-item">📏 ${product.size_human || 'N/A'}</span>
                    </div>
                    <div class="description">
                        ${product.region} • Site: ${product.site_code}
                    </div>
                    <div class="actions">
                        <a href="https://storage.googleapis.com/nmfs_odp_pifsc/PIFSC/ESD/ARP/data_management/dataset_index/optical-products/vital-rates/items/${product.id}.json" class="btn" target="_blank">Details</a>
                        <a href="https://storage.googleapis.com/nmfs_odp_pifsc/PIFSC/ESD/ARP/data_management/dataset_index/optical-products/vital-rates/previews/${product.large_preview}" class="btn btn-primary" target="_blank" rel="noopener">Preview</a>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderCharts(summary) {
        const ctx1 = document.getElementById('chart-by-type').getContext('2d');
        new Chart(ctx1, {
            type: 'pie',
            data: {
                labels: ['DEM', 'Ortho'],
                datasets: [{
                    data: [summary.by_type.dem, summary.by_type.ortho],
                    backgroundColor: ['#A855F7', '#22C55E']
                }]
            },
            options: {
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });

        const ctx2 = document.getElementById('chart-by-year').getContext('2d');
        new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: Object.keys(summary.by_year),
                datasets: [{
                    label: 'Products by Year',
                    data: Object.values(summary.by_year),
                    backgroundColor: '#2563EB'
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    document.addEventListener('DOMContentLoaded', fetchData);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
