<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Optics Data — Summary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#0b1220; --card:#131b2e; --text:#e7ecf3; --muted:#9fb2d1; }
    body { margin:0; font-family:system-ui,Segoe UI,Roboto,Inter,Arial; background:var(--bg); color:var(--text); }
    header { padding:24px 20px; }
    h1 { margin:0 0 6px; font-size:22px; }
    .path { color:var(--muted); font-size:13px; }
    .wrap { padding:0 20px 40px; max-width:1200px; margin:auto; }
    .tiles { display:grid; gap:16px; grid-template-columns: repeat(4, minmax(0,1fr)); }
    .tile { background:var(--card); border-radius:16px; padding:16px; box-shadow:0 4px 16px rgba(0,0,0,.2); }
    .tile h3 { margin:0 0 8px; font-size:14px; color:var(--muted); font-weight:600; letter-spacing:.02em; }
    .tile .big { font-size:28px; font-weight:700; }
    .grid { display:grid; gap:16px; grid-template-columns: 1fr 1fr; margin-top:20px; }
    canvas { width:100%; height:320px; background:var(--card); border-radius:16px; padding:12px; }
    .list { background:var(--card); border-radius:16px; padding:12px; max-height:360px; overflow:auto; }
    .row { display:flex; justify-content:space-between; padding:8px 6px; border-bottom:1px solid rgba(255,255,255,.06); font-size:14px; }
    .row:last-child { border-bottom:0; }
    .muted { color:var(--muted); }
    a { color:#8ec7ff; text-decoration:none; }
    @media (max-width: 960px) { .tiles { grid-template-columns: repeat(2, 1fr); } .grid{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Optics Data — Summary</h1>
    <div class="path" id="rootPath">Loading…</div>
  </header>
  <div class="wrap">
    <section class="tiles" id="tiles">
      <!-- totals tiles injected here -->
    </section>

    <section class="grid" style="margin-top:20px">
      <div>
        <canvas id="byYear"></canvas>
      </div>
      <div>
        <canvas id="byIsland"></canvas>
      </div>
    </section>

    <section class="grid" style="margin-top:20px">
      <div class="list" id="largestByImages"></div>
      <div class="list" id="largestBySize"></div>
    </section>
  </div>

  <!-- Chart.js (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module">
    // load summary.json; allow ?src=relative/or/absolute/path.json
    const params = new URLSearchParams(location.search);
    const src = params.get('src') || 'summary.json';

    const prettyInt = (n) => (n||0).toLocaleString();
    const el = (sel) => document.querySelector(sel);

    const resp = await fetch(src);
    const S = await resp.json();

    el('#rootPath').textContent = S.build_info?.root ?? '';

    // tiles
    const tiles = [
      { label:'Datasets', value: S.totals?.datasets },
      { label:'Images', value: S.totals?.images },
      { label:'Videos', value: S.totals?.videos || 0 },
      { label:'Total Size', value: S.totals?.size_human },
    ];
    const tilesWrap = el('#tiles');
    tiles.forEach(t => {
      const d = document.createElement('div');
      d.className = 'tile';
      d.innerHTML = `<h3>${t.label}</h3><div class="big">${typeof t.value==='number' ? prettyInt(t.value) : t.value}</div>`;
      tilesWrap.appendChild(d);
    });

    // by year chart
    const yearLabels = Object.keys(S.by_year || {});
    const yearValues = Object.values(S.by_year || {});
    new Chart(el('#byYear'), {
      type:'bar',
      data:{ labels: yearLabels, datasets: [{ label:'Datasets by Year', data: yearValues }]},
      options:{ plugins:{ legend:{ display:false }}, scales:{ x:{ ticks:{ color:'#cfe1ff'}}, y:{ ticks:{ color:'#cfe1ff'}}}}
    });

    // by island top10 chart
    const island = S.by_island_top10 || {};
    const islLabels = Object.keys(island);
    const islValues = Object.values(island);
    new Chart(el('#byIsland'), {
      type:'bar',
      data:{ labels: islLabels, datasets:[{ label:'Datasets by Island (Top 10)', data: islValues }]},
      options:{ plugins:{ legend:{ display:false }}, indexAxis:'y',
        scales:{ x:{ ticks:{ color:'#cfe1ff'}}, y:{ ticks:{ color:'#cfe1ff'}}}}
    });

    // largest lists
    const makeList = (arr, leftKey, rightKey, rightFmt) => {
      const wrap = document.createElement('div');
      wrap.innerHTML = `<div class="row"><div class="muted">${leftKey}</div><div class="muted">${rightKey}</div></div>`;
      (arr||[]).forEach(r => {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<div><a href="items/${r.id}.json" target="_blank">${r.title}</a><div class="muted">${r.gs_prefix}</div></div>
                         <div>${rightFmt(r)}</div>`;
        wrap.appendChild(row);
      });
      return wrap;
    };
    el('#largestByImages').appendChild(
      makeList(S.largest_datasets_by_images_top25, 'Largest by images', 'Images', r => prettyInt(r.images))
    );
    el('#largestBySize').appendChild(
      makeList(S.largest_datasets_by_size_top25, 'Largest by size', 'Size', r => r.size_human)
    );
  </script>
</body>
</html>
