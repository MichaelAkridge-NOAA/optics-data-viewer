<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCC-ASC-003 Enhanced SFM Viewer - NOAA Optics Data Portal</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Potree CSS -->
  <link rel="stylesheet" href="../../build/potree/potree.css" />
  <link rel="stylesheet" href="../../libs/jquery-ui/jquery-ui.min.css" />
  <link rel="stylesheet" href="../../libs/openlayers3/ol.css" />
  <link rel="stylesheet" href="../../libs/spectrum/spectrum.css" />
  <link rel="stylesheet" href="../../libs/jstree/themes/mixed/style.css" />

  <style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
    
    /* Loading + error */
    #loading {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(10,10,15,.7); color:#e8eefc; font:15px system-ui,Segoe UI,Roboto,Arial;
      z-index:9999; flex-direction:column; gap:10px
    }
    #loading .spinner { width:40px; height:40px; border-radius:50%;
      border:3px solid rgba(255,255,255,.25); border-top-color:#fff; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg) } }

    #error {
      position:absolute; top:12px; left:12px; right:12px;
      background:rgba(180,30,40,.9); color:#fff; padding:10px 12px; border-radius:8px; display:none; z-index:10000
    }

    .chip{
      position:absolute; bottom:12px; left:12px; background:rgba(20,20,30,.55); color:#fff;
      padding:6px 10px; border-radius:10px; font:13px system-ui; z-index:4
    }

    /* Camera controls panel */
    #cameraPanel {
      position:absolute; top:12px; right:12px; background:rgba(20,20,30,.85); color:#fff;
      padding:12px; border-radius:8px; font:13px system-ui; z-index:5; display:none;
      max-width:300px; max-height:calc(100vh - 100px); overflow-y:auto;
    }

    #cameraPanel h3 { margin:0 0 10px 0; font-size:14px; }
    #cameraPanel button {
      background:rgba(60,120,180,.8); color:#fff; border:none; padding:6px 12px;
      border-radius:4px; cursor:pointer; margin:2px; font-size:12px;
    }
    #cameraPanel button:hover { background:rgba(80,140,200,.9); }
    #cameraPanel button.active { background:rgba(80,180,80,.8); }

    .camera-controls { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0; }
    .camera-list { max-height:200px; overflow-y:auto; margin:8px 0; }
    .camera-item {
      background:rgba(40,40,50,.6); padding:6px 8px; margin:2px 0; border-radius:4px;
      cursor:pointer; border-left:3px solid transparent; transition: all 0.2s ease;
    }
    .camera-item:hover { background:rgba(60,60,70,.8); transform: translateX(2px); }
    .camera-item.active { border-left-color:#4CAF50; background:rgba(80,180,80,.3); }
    
    /* Distance indicator styling */
    .distance-indicator {
      display: inline-block; padding: 2px 6px; border-radius: 10px; font-size: 10px;
      background: rgba(76,175,80,.2); color: #4CAF50; margin-left: 4px;
    }
    
    /* Button hover effects */
    #cameraPanel button:hover {
      background:rgba(80,140,200,.9); transform: translateY(-1px); box-shadow: 0 2px 4px rgba(0,0,0,.3);
    }
    #cameraPanel button.active { 
      background:rgba(80,180,80,.8); box-shadow: 0 0 8px rgba(80,180,80,.5);
    }

    /* Sidebar Thumbnail Carousel */
    #sidebarThumbnailCarousel {
      background: rgba(40,40,50,.4); border-radius: 6px; padding: 10px; margin: 8px 0;
      display: none; /* Hidden by default */
    }
    
    .sidebar-carousel-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
      color: #fff; font-size: 12px; font-weight: bold;
    }
    
    .sidebar-carousel-close {
      background: rgba(180,30,40,.6); color: #fff; border: none; border-radius: 3px; 
      width: 20px; height: 20px; cursor: pointer; font-size: 12px; 
      display: flex; align-items: center; justify-content: center;
    }
    .sidebar-carousel-close:hover { background: rgba(200,50,60,.8); }
    
    .sidebar-thumbnail-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; 
      max-height: 200px; overflow-y: auto; margin-bottom: 8px;
    }
    
    .sidebar-thumbnail-item {
      position: relative; border: 1px solid transparent; border-radius: 4px; overflow: hidden;
      cursor: pointer; transition: all 0.2s ease; background: rgba(60,60,70,0.6);
    }
    .sidebar-thumbnail-item:hover { border-color: #4CAF50; transform: scale(1.02); }
    .sidebar-thumbnail-item.active { border-color: #FFD700; box-shadow: 0 0 6px rgba(255,215,0,0.4); }
    
    .sidebar-thumbnail-img {
      width: 100%; height: 60px; object-fit: cover; display: block;
    }
    
    .sidebar-thumbnail-label {
      position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8);
      color: #fff; font-size: 8px; padding: 2px 4px; text-align: center;
    }
    
    .sidebar-thumbnail-distance {
      position: absolute; top: 2px; right: 2px; background: rgba(76,175,80,0.9);
      color: #fff; font-size: 7px; padding: 1px 3px; border-radius: 2px;
    }
    
    .sidebar-carousel-actions {
      display: flex; gap: 4px; justify-content: center; align-items: center;
    }
    
    .sidebar-carousel-actions button {
      background: rgba(60,120,180,.7); color: #fff; border: none; padding: 4px 8px;
      border-radius: 4px; cursor: pointer; font-size: 10px; transition: all 0.2s ease;
    }
    .sidebar-carousel-actions button:hover { background: rgba(80,140,200,.9); }
    .sidebar-carousel-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .sidebar-full-image-btn { background: rgba(255,165,0,.7) !important; }
    .sidebar-full-image-btn:hover { background: rgba(255,185,20,.9) !important; }
  </style>
</head>
<body>

  <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px;">
    <div id="potree_render_area">
    </div>
    <div id="potree_sidebar_container"> </div>
  </div>

  <div id="error"></div>
  <div id="loading"><div class="spinner"></div><div>Loading enhanced SFM viewer…</div></div>
  <div class="chip" id="chip"></div>

  <!-- Camera Controls Panel -->
  <div id="cameraPanel">
    <h3>OCC-ASC-003 Cameras</h3>
    <div class="camera-controls">
      <button id="btnToggleFrustums">Toggle Cameras</button>
      <button id="btnToggleImagePlane">Toggle Images</button>
      <button id="btnLoadCameras">Reload Cameras</button>
      <button id="btnShowAllCameras">Show All</button>
      <button id="btnDebugCoords">Debug Coords</button>
    </div>
    <div style="margin: 8px 0; padding: 6px; background: rgba(40,40,50,.4); border-radius: 4px; font-size: 11px;">
      <strong>💡 Tip:</strong> Click on the point cloud to see nearby camera thumbnails. Click any thumbnail to open the full image!
    </div>

    <!-- Sidebar Thumbnail Carousel -->
    <div id="sidebarThumbnailCarousel">
      <div class="sidebar-carousel-header">
        <span id="sidebarCarouselTitle">Nearby Cameras</span>
        <button class="sidebar-carousel-close" onclick="closeSidebarCarousel()">×</button>
      </div>
      <div class="sidebar-thumbnail-grid" id="sidebarThumbnailGrid"></div>
      <div class="sidebar-carousel-actions">
        <button id="sidebarSelectAllBtn" onclick="selectAllSidebarThumbnails()">Select All</button>
        <button id="sidebarFullImageBtn" class="sidebar-full-image-btn" onclick="openFullImageSidebar()">View Full Size</button>
      </div>
    </div>

    <div id="cameraStats" style="margin:8px 0;font-size:11px;color:#aaa;"></div>

    <div class="camera-list" id="cameraList"></div>
  </div>

  <!-- Libraries -->
  <script src="../../libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="../../libs/spectrum/spectrum.js"></script>
  <script src="../../libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="../../libs/other/BinaryHeap.js"></script>
  <script src="../../libs/tween/tween.min.js"></script>
  <script src="../../libs/d3/d3.js"></script>
  <script src="../../libs/proj4/proj4.js"></script>
  <script src="../../libs/openlayers3/ol.js"></script>
  <script src="../../libs/i18next/i18next.js"></script>
  <script src="../../libs/jstree/jstree.js"></script>

  <!-- Potree -->
  <script src="../../build/potree/potree.js"></script>
  <script src="../../libs/plasio/js/laslaz.js"></script>
  
  <!-- THREE.js library (separate from Potree for camera overlay) -->
  <script src="../../libs/three.js/build/three.min.js"></script>

  <!-- Camera Overlay Module -->
  <script src="js/cameraOverlay.js"></script>

  <script>
    // ---- Complete OCC-ASC-003 Dataset Configuration
    const qs = new URLSearchParams(location.search);
    
    // Default URLs for OCC-ASC-003 dataset from Google Cloud Storage
    const defaultSrc = 'https://storage.googleapis.com/nmfs_odp_pifsc/PIFSC/ESD/ARP/data_management/temp/sfm_test/20220724_OCC-ASC-003/cloud.js';
    const defaultCameraSrc = 'https://storage.googleapis.com/nmfs_odp_pifsc/PIFSC/ESD/ARP/data_management/temp/sfm_test/20220724_OCC-ASC-003/20220724_OCC-ASC-003_RA2201.cams.xml';
    const defaultImageBase = 'https://storage.googleapis.com/nmfs_odp_pifsc/PIFSC/ESD/ARP/Photogrammetric%20Imagery/Fixed_Sites/MARI/ASC/OCC-ASC-003/2022/20220724_OCC-ASC-003_RA2201';
    const defaultThumbnailBase = 'https://storage.googleapis.com/nmfs_odp_pifsc/PIFSC/ESD/ARP/data_management/temp/sfm_test/20220724_OCC-ASC-003/thumbnails';
    
    // Use URL parameters or defaults
    const src = qs.get('src') || defaultSrc;
    const title = qs.get('title') || 'OCC-ASC-003 Enhanced SFM Point Cloud';
    const cameraSrc = qs.get('cameras') || defaultCameraSrc;
    const imageBase = qs.get('imageBase') || qs.get('images') || defaultImageBase;
    const thumbnailBase = qs.get('thumbnailBase') || qs.get('thumbnails') || defaultThumbnailBase;
    
    const chip = document.getElementById('chip'); 
    chip.textContent = title;

    const errorBox = document.getElementById('error');
    const loading = document.getElementById('loading');
    const cameraPanel = document.getElementById('cameraPanel');

    // Global variables
    let cameraOverlay = null;
    let pointCloudClickHandler = null;

    function showError(msg, details) {
      errorBox.style.display = 'block';
      errorBox.innerHTML = `<strong>Couldn't load point cloud.</strong> ${msg}`
        + (details ? `<div style="opacity:.9;margin-top:6px;font-size:13px">${details}</div>` : '');
      console.error('Potree load error:', msg, details);
      loading.style.display = 'none';
    }

    if (!src) {
      showError('Point cloud source not available.',
        'The OCC-ASC-003 point cloud may not be accessible. Try using a ?src= parameter with a valid point cloud URL.');
    } else {
      console.log('Initializing OCC-ASC-003 Enhanced SFM viewer...');
      console.log('Point Cloud:', src);
      console.log('Camera Data:', cameraSrc);
      console.log('Image Base:', imageBase);
      
      // Initialize viewer with settings similar to regular SFM viewer
      window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
      
      viewer.setEDLEnabled(false);
      viewer.setFOV(60);
      viewer.setPointBudget(3_000_000);
      viewer.loadSettingsFromURL();
      viewer.setDescription(`
      OCC-ASC-003 Enhanced SFM Point Cloud Viewer<br>
      <strong>Location:</strong> American Samoa - July 24, 2022
      `);
      
      console.log('Loading GUI...');
      
      // Load GUI
      viewer.loadGUI(() => {
        console.log('GUI loaded, setting up enhanced functionality...');
        viewer.setLanguage('en');
        $("#menu_scene").next().show();
        $("#menu_tools").next().show();
        viewer.toggleSidebar();
        
        // Initialize export functionality
        initializeSidebarExports();
        
        console.log('Loading point cloud...');
        
        // Load point cloud with simplified approach (like regular SFM viewer)
        Potree.loadPointCloud(src, title, e => {
          console.log('Point cloud load callback triggered');
          let scene = viewer.scene;
          let pointcloud = e.pointcloud;
          
          let material = pointcloud.material;
          material.size = 1;
          material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
          material.shape = Potree.PointShape.SQUARE;
          
          scene.addPointCloud(pointcloud);
          
          // Setup point cloud click handler for camera selection
          setupPointCloudClickHandler(pointcloud);
          
          viewer.fitToScreen();
          loading.style.display = 'none';
          
          // Show camera panel
          cameraPanel.style.display = 'block';
          
          console.log('Point cloud loaded, initializing camera overlay...');
          
          // Initialize camera overlay system
          initializeCameraOverlay();
          
          // Start monitoring for camera animations
          setTimeout(() => {
            monitorCameraAnimations();
          }, 1000);
        });
      });
    }

    /**
     * Initialize camera overlay with error handling
     */
    function initializeCameraOverlay() {
      try {
        console.log('THREE.js available:', typeof THREE !== 'undefined' ? 'Yes (r' + THREE.REVISION + ')' : 'No');
        
        cameraOverlay = new SFMCameraOverlay(viewer, {
          baseURL: imageBase || defaultImageBase,
          thumbnailBaseURL: thumbnailBase || defaultThumbnailBase,
          imageDir: '', // Images are directly in the base URL path
          thumbnailDir: '', // Thumbnails are directly in the thumbnail base URL path
          scaleImage: 2.0, // Increased scale for better visibility
          showFrustums: true,
          showImagePlane: false
        });
        
        // Setup camera panel
        setupCameraPanel();
        
        console.log('Enhanced SFM viewer loaded successfully');
        
        // Auto-load cameras from default or provided URL
        if (cameraSrc) {
          console.log('Auto-loading cameras from:', cameraSrc);
          loadCameraDataFromURL(cameraSrc);
        }
      } catch (error) {
        console.error('Failed to initialize camera overlay:', error);
        // Show error in camera panel
        document.getElementById('cameraStats').innerHTML = 
          '<span style="color: #ff6b6b;">Camera overlay failed to load</span>';
      }
    }

    /**
     * Setup point cloud click handler for camera selection
     */
    function setupPointCloudClickHandler(pointcloud) {
      console.log('Setting up point cloud click handler...');
      
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      
      function onPointCloudClick(event) {
        // Only handle left clicks
        if (event.button !== 0) return;
        
        // Calculate mouse position in normalized device coordinates
        const rect = viewer.renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        
        // Update raycaster
        raycaster.setFromCamera(mouse, viewer.scene.getActiveCamera());
        
        // Find intersection with point cloud
        const intersects = raycaster.intersectObject(pointcloud, true);
        
        if (intersects.length > 0) {
          const intersection = intersects[0];
          const clickPoint = intersection.point;
          
          console.log('🎯 Point cloud clicked at:', clickPoint.toArray().map(n => n.toFixed(2)));
          console.log('📊 Point cloud info:', {
            position: pointcloud.position.toArray(),
            scale: pointcloud.scale.toArray(),
            matrixWorld: pointcloud.matrixWorld.elements.slice(0, 16).map(n => n.toFixed(3))
          });
          
          if (cameraOverlay && cameraOverlay.cameras.length > 0) {
            showNearestCameras(clickPoint);
          } else {
            console.log('No cameras loaded yet.');
          }
        }
      }
      
      // Add click event listener
      pointCloudClickHandler = onPointCloudClick;
      viewer.renderer.domElement.addEventListener('click', pointCloudClickHandler);
      
      console.log('✅ Point cloud click handler setup complete');
    }

    /**
     * Show cameras near the clicked point with thumbnail carousel
     */
    function showNearestCameras(clickPoint, maxDistance = 100, maxCameras = 12) {
      // Debug: Log both point cloud click coordinates and camera positions
      console.log('🎯 Point cloud click coordinates:', clickPoint.toArray().map(n => n.toFixed(2)));
      console.log('📷 Sample camera positions (first 3):');
      cameraOverlay.cameras.slice(0, 3).forEach((cam, i) => {
        console.log(`  Camera ${i}: [${cam.position.map(p => p.toFixed(2)).join(', ')}]`);
      });
      
      // Get point cloud's transformation matrix for coordinate alignment
      let transformedClickPoint = clickPoint.clone();
      
      // Apply inverse transformation if point cloud has been transformed
      if (pointcloud.matrixWorld && !pointcloud.matrixWorld.equals(new THREE.Matrix4())) {
        const inverseMatrix = new THREE.Matrix4().copy(pointcloud.matrixWorld).invert();
        transformedClickPoint.applyMatrix4(inverseMatrix);
        console.log('🔄 Transformed click point:', transformedClickPoint.toArray().map(n => n.toFixed(2)));
      }
      
      // Calculate distances using both original and transformed coordinates
      const nearCameras = cameraOverlay.cameras
        .map((camera, index) => {
          // Try both coordinate systems
          const camPos = new THREE.Vector3(...camera.position);
          
          // Distance in original coordinates
          const distance1 = camPos.distanceTo(clickPoint);
          
          // Distance with transformation
          const distance2 = camPos.distanceTo(transformedClickPoint);
          
          // Use the smaller distance (better alignment)
          const distance = Math.min(distance1, distance2);
          
          return { camera, index, distance, rawDistance: distance1, transformedDistance: distance2 };
        })
        .filter(item => item.distance <= maxDistance)
        .sort((a, b) => a.distance - b.distance)
        .slice(0, maxCameras);
      
      console.log(`📍 Found ${nearCameras.length} cameras within ${maxDistance} units of clicked point`);
      
      // Debug: Show distance comparison for nearest cameras
      nearCameras.slice(0, 3).forEach(item => {
        console.log(`  ${item.camera.label}: raw=${item.rawDistance.toFixed(1)}, transformed=${item.transformedDistance.toFixed(1)}, used=${item.distance.toFixed(1)}`);
      });
      
      // If still no cameras found, try coordinate system scaling
      if (nearCameras.length === 0) {
        console.log('🔍 No cameras found, trying coordinate system scaling...');
        
        // Try different scale factors to account for coordinate system differences
        const scaleFactors = [0.1, 0.01, 10, 100, 1000];
        
        for (const scale of scaleFactors) {
          const scaledClickPoint = clickPoint.clone().multiplyScalar(scale);
          console.log(`  Trying scale ${scale}: click point = [${scaledClickPoint.toArray().map(n => n.toFixed(2)).join(', ')}]`);
          
          const testCameras = cameraOverlay.cameras
            .map((camera, index) => {
              const camPos = new THREE.Vector3(...camera.position);
              const distance = camPos.distanceTo(scaledClickPoint);
              return { camera, index, distance, scale, rawDistance: distance, transformedDistance: distance };
            })
            .filter(item => item.distance <= maxDistance)
            .sort((a, b) => a.distance - b.distance)
            .slice(0, Math.min(3, maxCameras));
          
          if (testCameras.length > 0) {
            console.log(`  ✅ Found ${testCameras.length} cameras with scale factor ${scale}!`);
            nearCameras = testCameras.slice(0, maxCameras);
            break;
          }
        }
        
        if (nearCameras.length === 0) {
          // Show message in camera panel
          document.getElementById('cameraStats').innerHTML = 
            '<span style="color: #ffa726;">No cameras found near clicked point - coordinate system mismatch?</span>';
          return;
        }
      }
      
      // Hide all camera frustums first
      cameraOverlay.turnCamerasOff();
      
      // Show only nearby cameras
      nearCameras.forEach(({ camera, index, distance }) => {
        const frustum = cameraOverlay.cameraObjects[index];
        if (frustum) {
          frustum.visible = true;
          // Highlight the nearest camera
          if (index === nearCameras[0].index) {
            frustum.traverse(child => {
              if (child.material) {
                child.material.color = new THREE.Color(0x4CAF50); // Green for nearest
              }
            });
          }
        }
        console.log(`📷 Camera ${index} (${camera.label}): ${distance.toFixed(1)} units away`);
      });
      
      // Update camera list in panel to show only nearby cameras
      updateCameraListWithNearest(nearCameras);
      
      // Show thumbnail carousel popup
      showThumbnailCarousel(nearCameras, clickPoint);
      
      // Update stats
      document.getElementById('cameraStats').innerHTML = 
        `<span style="color: #4CAF50;">Showing ${nearCameras.length} nearest cameras</span>`;
    }

    /**
     * Update camera list to show nearest cameras
     */
    function updateCameraListWithNearest(nearCameras) {
      const cameraList = document.getElementById('cameraList');
      cameraList.innerHTML = '<div style="margin-bottom: 8px; font-size: 11px; color: #aaa;">Nearest cameras to clicked point:</div>';

      nearCameras.forEach(({ camera, index, distance }, listIndex) => {
        const item = document.createElement('div');
        item.className = 'camera-item';
        item.innerHTML = `
          <strong>${listIndex + 1}. ${camera.label || camera.id || `Camera ${index}`}</strong><br>
          <small style="color: #aaa;">Distance: ${distance.toFixed(1)} units</small>
        `;
        
        item.onclick = () => {
          // Remove previous active
          document.querySelectorAll('.camera-item.active').forEach(el => {
            el.classList.remove('active');
          });
          
          // Set this as active
          item.classList.add('active');
          
          // Fly to camera
          cameraOverlay.flyToCamera(index);
          
          console.log(`Selected nearby camera ${index}: ${camera.label || camera.id}`);
        };
        
        // Highlight the nearest camera
        if (listIndex === 0) {
          item.style.borderLeftColor = '#4CAF50';
          item.style.backgroundColor = 'rgba(76, 175, 80, 0.2)';
        }
        
        cameraList.appendChild(item);
      });
      
      // Add button to show all cameras again
      const showAllBtn = document.createElement('button');
      showAllBtn.textContent = 'Show All Cameras';
      showAllBtn.className = 'camera-item';
      showAllBtn.style.textAlign = 'center';
      showAllBtn.style.marginTop = '8px';
      showAllBtn.onclick = () => {
        cameraOverlay.turnCamerasOn();
        updateCameraList(cameraOverlay.cameras);
        document.getElementById('cameraStats').textContent = 
          `Showing all ${cameraOverlay.cameras.length} cameras`;
      };
      cameraList.appendChild(showAllBtn);
    }

    /**
     * Show thumbnail carousel in sidebar
     */
    function showThumbnailCarousel(nearCameras, clickPoint) {
      const carousel = document.getElementById('sidebarThumbnailCarousel');
      const grid = document.getElementById('sidebarThumbnailGrid');
      const title = document.getElementById('sidebarCarouselTitle');
      
      // Set title
      title.textContent = `${nearCameras.length} Nearby Cameras (Click to Open)`;
      
      // Clear previous thumbnails
      grid.innerHTML = '';
      
      let selectedCameras = new Set();
      
      // Create thumbnail items
      nearCameras.forEach(({ camera, index, distance }, listIndex) => {
        const thumbnailItem = document.createElement('div');
        thumbnailItem.className = 'sidebar-thumbnail-item';
        
        // Get thumbnail URL
        const thumbnailURL = getThumbnailURL(camera.imageName);
        
        thumbnailItem.innerHTML = `
          <img class="sidebar-thumbnail-img" 
               src="${thumbnailURL}" 
               alt="${camera.label}" 
               loading="lazy"
               onerror="console.warn('❌ Failed to load thumbnail:', this.src); this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JveD0iMCAwIDEwMCAxMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjEwMCIgaGVpZ2h0PSIxMDAiIGZpbGw9IiNmMGYwZjAiLz48dGV4dCB4PSI1MCIgeT0iNTUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+Tm8gSW1hZ2U8L3RleHQ+PC9zdmc+';"
               onload="console.log('✅ Thumbnail loaded:', this.src);">
          <div class="sidebar-thumbnail-label">${camera.label}</div>
          <div class="sidebar-thumbnail-distance">${distance.toFixed(1)}m</div>
        `;
        
        // Handle thumbnail selection and auto-open
        thumbnailItem.onclick = () => {
          // Get full image URL and open immediately

    /**
     * Load camera data from local file
     */
    function loadCameraDataFromFile(file) {
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          document.getElementById('cameraStats').textContent = 'Processing file...';
          
          let cameras;
          if (file.name.endsWith('.json')) {
            cameras = JSON.parse(e.target.result);
            cameraOverlay.cameras = cameras;
            cameraOverlay.createCameraFrustums();
          } else if (file.name.endsWith('.xml')) {
            cameras = cameraOverlay.parseXMLCameraData(e.target.result);
            cameraOverlay.cameras = cameras;
            cameraOverlay.createCameraFrustums();
          } else {
            throw new Error('Unsupported file format. Use .xml or .json');
          }
          
          updateCameraList(cameras);
          document.getElementById('cameraStats').textContent = 
            `Loaded ${cameras.length} cameras from file`;
            
        } catch (error) {
          console.error('Error processing camera file:', error);
          document.getElementById('cameraStats').textContent = 
            `Error: ${error.message}`;
        }
      };
      reader.readAsText(file);
    }

    /**
     * Keyboard shortcuts
     */
    document.addEventListener('keydown', (e) => {
      // Check if carousel is open
      const carouselOpen = document.getElementById('sidebarThumbnailCarousel').style.display === 'block';
      
      if (carouselOpen) {
        // Carousel-specific shortcuts
        if (e.key === 'Escape') {
          closeThumbnailCarousel();
          return;
        }
        return; // Don't handle other shortcuts when carousel is open
      }
      
      if (!cameraOverlay || !cameraOverlay.cameras.length) return;
      
      // Number keys 1-9 to jump to cameras
      if (e.key >= '1' && e.key <= '9') {
        const cameraIndex = parseInt(e.key) - 1;
        if (cameraIndex < cameraOverlay.cameras.length) {
          cameraOverlay.flyToCamera(cameraIndex);
          
          // Update UI
          document.querySelectorAll('.camera-item.active').forEach(el => {
            el.classList.remove('active');
          });
          const item = document.querySelector(`.camera-item:nth-child(${cameraIndex + 1})`);
          if (item) item.classList.add('active');
        }
      }
      
      // 'C' to toggle cameras
      if (e.key.toLowerCase() === 'c' && e.ctrlKey) {
        e.preventDefault();
        document.getElementById('btnToggleFrustums').click();
      }
      
      // 'I' to toggle image plane
      if (e.key.toLowerCase() === 'i' && e.ctrlKey) {
        e.preventDefault();
        document.getElementById('btnToggleImagePlane').click();
      }

      // 'A' to show all cameras
      if (e.key.toLowerCase() === 'a' && e.ctrlKey) {
        e.preventDefault();
        document.getElementById('btnShowAllCameras').click();
      }

      // Arrow keys for navigation
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        const direction = e.key === 'ArrowRight' ? 1 : -1;
        if (cameraOverlay.currentCameraId !== null) {
          const currentIndex = cameraOverlay.cameras.findIndex(
            cam => cam.id === cameraOverlay.currentCameraId
          );
          const newIndex = (currentIndex + direction + cameraOverlay.cameras.length) % cameraOverlay.cameras.length;
          cameraOverlay.flyToCamera(newIndex);
        }
      }
    });

    // Make functions available globally (for backwards compatibility)
    window.saveCameraTrack = function(animation) {
      const qs = new URLSearchParams(location.search);
      const src = qs.get('src');
      const title = qs.get('title') || 'Enhanced SFM Point Cloud';
      
      try {
        const trackData = {
          version: "1.0",
          created: new Date().toISOString(),
          title: title || "Camera Track",
          pointCloudSrc: src,
          duration: animation.duration || 10,
          controlPoints: []
        };

        // Export all control points
        for (let i = 0; i < animation.controlPoints.length; i++) {
          const cp = animation.controlPoints[i];
          trackData.controlPoints.push({
            index: i,
            position: cp.position.toArray(),
            target: cp.target.toArray(),
            time: cp.time || (i / (animation.controlPoints.length - 1))
          });
        }

        // Create and download the file
        const blob = new Blob([JSON.stringify(trackData, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${(title || 'camera-track').replace(/\s+/g, '-').toLowerCase()}-${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        console.log('Camera track saved successfully');
        alert(`Camera track saved with ${trackData.controlPoints.length} keyframes`);
      } catch (error) {
        console.error('Error saving camera track:', error);
        alert('Error saving camera track: ' + error.message);
      }
    };

    window.loadCameraTrack = function(animation, file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const trackData = JSON.parse(e.target.result);
          
          // Check if this is a camera track file (with controlPoints) or single camera position
          if (trackData.controlPoints && Array.isArray(trackData.controlPoints)) {
            // This is a proper camera track file
            console.log('Loading camera track with', trackData.controlPoints.length, 'keyframes');
            
            // Clear existing control points
            window.clearCameraTrack(animation);

            // Load control points
            for (const cpData of trackData.controlPoints) {
              if (cpData.position && cpData.target && cpData.position.length === 3 && cpData.target.length === 3) {
                const cp = animation.createControlPoint();
                cp.position.fromArray(cpData.position);
                cp.target.fromArray(cpData.target);
                if (cpData.time !== undefined) {
                  cp.time = cpData.time;
                }
              }
            }

            // Set duration if available
            if (trackData.duration) {
              animation.duration = trackData.duration;
            }

            console.log('Camera track loaded successfully');
            alert(`Camera track loaded with ${trackData.controlPoints.length} keyframes`);
            
            // Reset animation to beginning
            animation.set(0);
            
          } else if (trackData.position && trackData.target) {
            // This looks like a single camera position file - convert it to a single keyframe
            console.log('Converting single camera position to keyframe');
            
            if (confirm('This appears to be a single camera position. Create a single keyframe from this position?')) {
              // Clear existing control points
              window.clearCameraTrack(animation);
              
              // Create single keyframe from the camera position
              const cp = animation.createControlPoint();
              if (Array.isArray(trackData.position) && trackData.position.length === 3) {
                cp.position.fromArray(trackData.position);
              }
              if (Array.isArray(trackData.target) && trackData.target.length === 3) {
                cp.target.fromArray(trackData.target);
              }
              
              console.log('Single camera position converted to keyframe');
              alert('Single camera position loaded as keyframe');
              
              // Reset animation to beginning
              animation.set(0);
            } else {
              alert('Use the sidebar "Load Camera" button for single camera positions');
            }
            
          } else {
            throw new Error('Invalid file format - missing controlPoints array or camera position data');
          }
          
        } catch (error) {
          console.error('Error loading camera track:', error);
          alert('Error loading camera track: ' + error.message);
        }
      };
      reader.readAsText(file);
    };

    window.clearCameraTrack = function(animation) {
      try {
        // Remove all control points
        const controlPoints = [...animation.controlPoints]; // Create a copy to avoid modification during iteration
        for (const cp of controlPoints) {
          animation.removeControlPoint(cp);
        }
        
        // Reset animation
        animation.set(0);
        animation.stop();
        
        console.log('Camera track cleared');
      } catch (error) {
        console.error('Error clearing camera track:', error);
        alert('Error clearing camera track: ' + error.message);
      }
    };

    window.getCameraState = function() {
      try {
        const v = viewer.scene.view;
        const cam = viewer.scene.getActiveCamera();
        
        // Get pivot/target - try multiple methods
        let target = [0, 0, 0];
        if (v.getPivot) {
          const pivot = v.getPivot();
          target = pivot.toArray ? pivot.toArray() : [pivot.x, pivot.y, pivot.z];
        } else if (v.pivot) {
          target = v.pivot.toArray ? v.pivot.toArray() : [v.pivot.x, v.pivot.y, v.pivot.z];
        }
        
        const cameraState = {
          position: cam.position.toArray(),
          target: target,
          fov: cam.fov || v.fov || 60
        };
        
        // Add view-specific properties if available
        if (v.yaw !== undefined) cameraState.yaw = v.yaw;
        if (v.pitch !== undefined) cameraState.pitch = v.pitch;
        if (v.radius !== undefined) cameraState.radius = v.radius;
        
        return cameraState;
      } catch (error) {
        console.error('Error getting camera state:', error);
        // Fallback - just get basic camera info
        const cam = viewer.scene.getActiveCamera();
        return {
          position: cam.position.toArray(),
          target: [0, 0, 0],
          fov: cam.fov || 60
        };
      }
    };

    window.setCameraState = function(state) {
      try {
        console.log('Setting camera state:', state);
        const v = viewer.scene.view;
        const cam = viewer.scene.getActiveCamera();
        
        // Set position first
        if (state.position && Array.isArray(state.position) && state.position.length === 3) {
          cam.position.set(state.position[0], state.position[1], state.position[2]);
          console.log('Camera position set to:', state.position);
        }
        
        // Set FOV
        if (typeof state.fov === 'number') {
          cam.fov = state.fov;
          cam.updateProjectionMatrix();
          console.log('Camera FOV set to:', state.fov);
        }
        
        // Set view properties (yaw, pitch, radius) - these are Potree-specific
        if (typeof state.yaw === 'number' && v.yaw !== undefined) {
          v.yaw = state.yaw;
          console.log('View yaw set to:', state.yaw);
        }
        if (typeof state.pitch === 'number' && v.pitch !== undefined) {
          v.pitch = state.pitch;
          console.log('View pitch set to:', state.pitch);
        }
        if (typeof state.radius === 'number' && v.radius !== undefined) {
          v.radius = state.radius;
          console.log('View radius set to:', state.radius);
        }
        
        // Set target/pivot - try multiple approaches
        if (state.target && Array.isArray(state.target) && state.target.length === 3) {
          const targetVector = new THREE.Vector3(state.target[0], state.target[1], state.target[2]);
          
          // Try Potree's view methods first
          if (v.lookAt) {
            v.lookAt(targetVector);
            console.log('Used view.lookAt for target:', state.target);
          } else if (v.setPivot) {
            v.setPivot(targetVector);
            console.log('Used view.setPivot for target:', state.target);
          } else {
            // Fallback to camera lookAt
            cam.lookAt(targetVector);
            console.log('Used camera.lookAt for target:', state.target);
          }
        }
        
        // Force update and render
        if (v.update) {
          v.update();
        }
        
        // Ensure the renderer updates
        if (viewer.setNeedsRedraw) {
          viewer.setNeedsRedraw();
        }
        
        // Alternative: force immediate render
        if (viewer.render) {
          viewer.render();
        }
        
        console.log('Camera state applied successfully');
        
      } catch (error) {
        console.error('Error in main setCameraState:', error);
        
        // Comprehensive fallback approach
        try {
          console.log('Attempting fallback camera positioning...');
          const cam = viewer.scene.getActiveCamera();
          
          if (state.position && Array.isArray(state.position) && state.position.length === 3) {
            cam.position.set(state.position[0], state.position[1], state.position[2]);
          }
          
          if (state.target && Array.isArray(state.target) && state.target.length === 3) {
            cam.lookAt(new THREE.Vector3(state.target[0], state.target[1], state.target[2]));
          }
          
          if (typeof state.fov === 'number') {
            cam.fov = state.fov;
            cam.updateProjectionMatrix();
          }
          
          // Force render
          if (viewer.setNeedsRedraw) {
            viewer.setNeedsRedraw();
          } else if (viewer.render) {
            viewer.render();
          }
          
          console.log('Fallback camera positioning successful');
          
        } catch (fallbackError) {
          console.error('Fallback camera setting failed:', fallbackError);
          throw new Error('Could not set camera position - both main and fallback methods failed');
        }
      }
    };
    
    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (cameraOverlay) {
        cameraOverlay.dispose();
      }
      if (pointCloudClickHandler) {
        viewer.renderer.domElement.removeEventListener('click', pointCloudClickHandler);
      }
    });

    // Make functions globally accessible
    window.showThumbnailCarousel = showThumbnailCarousel;
    window.closeThumbnailCarousel = closeThumbnailCarousel;
    window.closeSidebarCarousel = closeSidebarCarousel;
    window.selectAllSidebarThumbnails = selectAllSidebarThumbnails;
    window.openFullImageSidebar = openFullImageSidebar;
    window.getThumbnailURL = getThumbnailURL;
    window.getFullImageURL = getFullImageURL;
  </script>
</body>
</html>
