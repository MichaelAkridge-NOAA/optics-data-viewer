<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCC-ASC-003 Enhanced SFM Viewer - NOAA Optics Data Portal</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Potree CSS -->
  <link rel="stylesheet" href="../../build/potree/potree.css" />
  <link rel="stylesheet" href="../../libs/jquery-ui/jquery-ui.min.css" />
  <link rel="stylesheet" href="../../libs/openlayers3/ol.css" />
  <link rel="stylesheet" href="../../libs/spectrum/spectrum.css" />
  <link rel="stylesheet" href="../../libs/jstree/themes/mixed/style.css" />

  <style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
    
    /* Loading + error */
    #loading {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(10,10,15,.7); color:#e8eefc; font:15px system-ui,Segoe UI,Roboto,Arial;
      z-index:9999; flex-direction:column; gap:10px
    }
    #loading .spinner { width:40px; height:40px; border-radius:50%;
      border:3px solid rgba(255,255,255,.25); border-top-color:#fff; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg) } }

    #error {
      position:absolute; top:12px; left:12px; right:12px;
      background:rgba(180,30,40,.9); color:#fff; padding:10px 12px; border-radius:8px; display:none; z-index:10000
    }

    .chip{
      position:absolute; bottom:12px; left:12px; background:rgba(20,20,30,.55); color:#fff;
      padding:6px 10px; border-radius:10px; font:13px system-ui; z-index:4
    }

    /* Camera controls panel */
    #cameraPanel {
      position:absolute; top:12px; right:12px; background:rgba(20,20,30,.85); color:#fff;
      padding:12px; border-radius:8px; font:13px system-ui; z-index:5; display:none;
      max-width:300px; max-height:calc(100vh - 100px); overflow-y:auto;
    }

    #cameraPanel h3 { margin:0 0 10px 0; font-size:14px; }
    #cameraPanel button {
      background:rgba(60,120,180,.8); color:#fff; border:none; padding:6px 12px;
      border-radius:4px; cursor:pointer; margin:2px; font-size:12px;
    }
    #cameraPanel button:hover { background:rgba(80,140,200,.9); }
    #cameraPanel button.active { background:rgba(80,180,80,.8); }

    .camera-controls { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0; }
    .camera-list { max-height:200px; overflow-y:auto; margin:8px 0; }
    .camera-item {
      background:rgba(40,40,50,.6); padding:6px 8px; margin:2px 0; border-radius:4px;
      cursor:pointer; border-left:3px solid transparent;
    }
    .camera-item:hover { background:rgba(60,60,70,.8); }
    .camera-item.active { border-left-color:#4CAF50; background:rgba(80,180,80,.3); }
  </style>
</head>
<body>

  <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px;">
    <div id="potree_render_area">
    </div>
    <div id="potree_sidebar_container"> </div>
  </div>

  <div id="error"></div>
  <div id="loading"><div class="spinner"></div><div>Loading enhanced SFM viewer…</div></div>
  <div class="chip" id="chip"></div>

  <!-- Camera Controls Panel -->
  <div id="cameraPanel">
    <h3>OCC-ASC-003 Cameras</h3>
    <div class="camera-controls">
      <button id="btnToggleFrustums">Show All Cameras</button>
      <button id="btnToggleImagePlane">Toggle Images</button>
      <button id="btnQueryMode" class="active">Click to Query</button>
      <button id="btnClearSelection">Clear Selection</button>
    </div>
    
    <div style="margin:8px 0;font-size:11px;color:#ccc;">
      <strong>Click Mode:</strong> Click on point cloud to see cameras that captured that area
    </div>

    <div id="cameraStats" style="margin:8px 0;font-size:11px;color:#aaa;"></div>
    <div id="selectionInfo" style="margin:4px 0;font-size:10px;color:#4CAF50;display:none;"></div>

    <div class="camera-list" id="cameraList"></div>
  </div>

  <!-- Libraries -->
  <script src="../../libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="../../libs/spectrum/spectrum.js"></script>
  <script src="../../libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="../../libs/other/BinaryHeap.js"></script>
  <script src="../../libs/tween/tween.min.js"></script>
  <script src="../../libs/d3/d3.js"></script>
  <script src="../../libs/proj4/proj4.js"></script>
  <script src="../../libs/openlayers3/ol.js"></script>
  <script src="../../libs/i18next/i18next.js"></script>
  <script src="../../libs/jstree/jstree.js"></script>

  <!-- Potree -->
  <script src="../../build/potree/potree.js"></script>
  <script src="../../libs/plasio/js/laslaz.js"></script>
  
  <!-- THREE.js library (separate from Potree for camera overlay) -->
  <script src="../../libs/three.js/build/three.min.js"></script>

  <!-- Camera Overlay Module -->
  <script src="js/cameraOverlay.js"></script>

  <script>
    // ---- Complete OCC-ASC-003 Dataset Configuration
    const qs = new URLSearchParams(location.search);
    
    // Default URLs for OCC-ASC-003 dataset from Google Cloud Storage
    const defaultSrc = 'https://storage.googleapis.com/nmfs_odp_pifsc/PIFSC/ESD/ARP/data_management/temp/sfm_test/20220724_OCC-ASC-003/cloud.js';
    const defaultCameraSrc = 'https://storage.googleapis.com/nmfs_odp_pifsc/PIFSC/ESD/ARP/data_management/temp/sfm_test/20220724_OCC-ASC-003/20220724_OCC-ASC-003_RA2201.cams.xml';
    const defaultImageBase = 'https://storage.googleapis.com/nmfs_odp_pifsc/PIFSC/ESD/ARP/Photogrammetric%20Imagery/Fixed_Sites/MARI/ASC/OCC-ASC-003/2022/20220724_OCC-ASC-003_RA2201';
    
    // Use URL parameters or defaults
    const src = qs.get('src') || defaultSrc;
    const title = qs.get('title') || 'OCC-ASC-003 Enhanced SFM Point Cloud';
    const cameraSrc = qs.get('cameras') || defaultCameraSrc;
    const imageBase = qs.get('imageBase') || qs.get('images') || defaultImageBase;
    
    const chip = document.getElementById('chip'); 
    chip.textContent = title;

    const errorBox = document.getElementById('error');
    const loading = document.getElementById('loading');
    const cameraPanel = document.getElementById('cameraPanel');

    // Global variables
    let cameraOverlay = null;

    function showError(msg, details) {
      errorBox.style.display = 'block';
      errorBox.innerHTML = `<strong>Couldn't load point cloud.</strong> ${msg}`
        + (details ? `<div style="opacity:.9;margin-top:6px;font-size:13px">${details}</div>` : '');
      console.error('Potree load error:', msg, details);
      loading.style.display = 'none';
    }

    if (!src) {
      showError('Point cloud source not available.',
        'The OCC-ASC-003 point cloud may not be accessible. Try using a ?src= parameter with a valid point cloud URL.');
    } else {
      console.log('Initializing OCC-ASC-003 Enhanced SFM viewer...');
      console.log('Point Cloud:', src);
      console.log('Camera Data:', cameraSrc);
      console.log('Image Base:', imageBase);
      
      // Initialize viewer
      window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
      
      viewer.setEDLEnabled(false);
      viewer.setFOV(60);
      viewer.setPointBudget(3_000_000);
      viewer.loadSettingsFromURL();
      viewer.setDescription(`
      OCC-ASC-003 Enhanced SFM Point Cloud Viewer<br>
      <strong>Complete Dataset:</strong> Point Cloud + Camera Positions + Photogrammetric Images<br>
      <strong>Location:</strong> American Samoa - July 24, 2022<br>
      <strong>Features:</strong> 3D camera frustums, image overlays, interactive navigation<br>
      Use the camera panel (top-right) to control camera overlays and navigate between photo positions.
      `);
      
      console.log('Loading GUI...');
      
      // Load GUI
      viewer.loadGUI(() => {
        console.log('GUI loaded, setting up enhanced functionality...');
        viewer.setLanguage('en');
        $("#menu_scene").next().show();
        $("#menu_tools").next().show();
        viewer.toggleSidebar();
        
        // Initialize export functionality
        initializeSidebarExports();
        
        console.log('Loading point cloud...');
        
        // Load point cloud first, then initialize camera overlay
        Potree.loadPointCloud(src, title, e => {
          console.log('Point cloud load callback triggered');
          let scene = viewer.scene;
          let pointcloud = e.pointcloud;
          
          let material = pointcloud.material;
          material.size = 1;
          material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
          material.shape = Potree.PointShape.SQUARE;
          
          scene.addPointCloud(pointcloud);
          
          viewer.fitToScreen();
          loading.style.display = 'none';
          
          // Show camera panel
          cameraPanel.style.display = 'block';
          
          console.log('Point cloud loaded, initializing camera overlay...');
          
          // Initialize camera overlay system
          try {
            console.log('THREE.js available:', typeof THREE !== 'undefined' ? 'Yes (r' + THREE.REVISION + ')' : 'No');
            
            cameraOverlay = new SFMCameraOverlay(viewer, {
              baseURL: imageBase || defaultImageBase,
              imageDir: '', // Images are directly in the base URL path
              thumbnailDir: '', // Use same images for thumbnails for now
              scaleImage: 0.5,
              showFrustums: false, // Start with cameras hidden due to high count
              showImagePlane: false
            });
            
            // Setup camera panel
            setupCameraPanel();
            
            console.log('Enhanced SFM viewer loaded successfully');
            
            // Auto-load cameras from default or provided URL
            if (cameraSrc) {
              console.log('Auto-loading cameras from:', cameraSrc);
              loadCameraDataFromURL(cameraSrc);
            }
          } catch (error) {
            console.error('Failed to initialize camera overlay:', error);
          }
        });
      });
    }

    /**
     * Setup camera control panel
     */
    function setupCameraPanel() {
      const btnToggleFrustums = document.getElementById('btnToggleFrustums');
      const btnToggleImagePlane = document.getElementById('btnToggleImagePlane');
      const btnQueryMode = document.getElementById('btnQueryMode');
      const btnClearSelection = document.getElementById('btnClearSelection');
      
      let queryModeActive = true; // Start in query mode
      let selectedCameras = [];

      // Toggle all camera frustums
      btnToggleFrustums.onclick = () => {
        if (cameraOverlay) {
          const visible = cameraOverlay.toggleCameraFrustums();
          btnToggleFrustums.textContent = visible ? 'Hide All Cameras' : 'Show All Cameras';
          btnToggleFrustums.classList.toggle('active', visible);
          
          if (visible) {
            // Disable query mode when showing all cameras
            queryModeActive = false;
            btnQueryMode.classList.remove('active');
            btnQueryMode.textContent = 'Click to Query';
          }
        }
      };

      // Toggle image plane
      btnToggleImagePlane.onclick = () => {
        if (cameraOverlay) {
          const visible = cameraOverlay.toggleImagePlane();
          btnToggleImagePlane.textContent = visible ? 'Hide Images' : 'Show Images';
          btnToggleImagePlane.classList.toggle('active', visible);
        }
      };

      // Toggle query mode
      btnQueryMode.onclick = () => {
        queryModeActive = !queryModeActive;
        btnQueryMode.classList.toggle('active', queryModeActive);
        btnQueryMode.textContent = queryModeActive ? 'Query Mode ON' : 'Click to Query';
        
        if (queryModeActive) {
          // Hide all cameras and enable click-to-query
          cameraOverlay.turnCamerasOff();
          btnToggleFrustums.textContent = 'Show All Cameras';
          btnToggleFrustums.classList.remove('active');
          console.log('Query mode enabled - click on point cloud to see relevant cameras');
        }
      };

      // Clear selection and hide selected cameras
      btnClearSelection.onclick = () => {
        selectedCameras = [];
        if (cameraOverlay) {
          cameraOverlay.clearSelectedCameras();
        }
        document.getElementById('selectionInfo').style.display = 'none';
        updateCameraList(cameraOverlay ? cameraOverlay.cameras : []);
        console.log('Camera selection cleared');
      };

      // Setup click-to-query on the point cloud
      const canvas = viewer.renderer.domElement;
      canvas.addEventListener('click', (event) => {
        if (!queryModeActive || !cameraOverlay) return;
        
        // Get click position in 3D space
        const rect = canvas.getBoundingClientRect();
        const mouse = new THREE.Vector2(
          ((event.clientX - rect.left) / rect.width) * 2 - 1,
          -((event.clientY - rect.top) / rect.height) * 2 + 1
        );
        
        // Raycast to find intersection with point cloud
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, viewer.scene.cameraP);
        
        // Find nearby cameras to the clicked point
        const clickedPoint = getClickedPoint(raycaster);
        if (clickedPoint) {
          findCamerasNearPoint(clickedPoint);
        }
      });
      
      function getClickedPoint(raycaster) {
        // This would ideally intersect with the point cloud
        // For now, we'll use a simple approach with a plane at average height
        const planeGeometry = new THREE.PlaneGeometry(1000, 1000);
        const plane = new THREE.Mesh(planeGeometry, new THREE.MeshBasicMaterial());
        plane.position.y = 0; // Adjust based on your point cloud height
        plane.rotation.x = -Math.PI / 2;
        
        const intersects = raycaster.intersectObject(plane);
        if (intersects.length > 0) {
          return intersects[0].point;
        }
        return null;
      }
      
      function findCamerasNearPoint(point) {
        if (!cameraOverlay || !cameraOverlay.cameras) return;
        
        console.log('Finding cameras near clicked point:', point);
        
        // Find cameras within a certain distance of the clicked point
        const maxDistance = 50; // Adjust based on your scene scale
        const nearbyCameras = [];
        
        cameraOverlay.cameras.forEach((camera, index) => {
          const cameraPos = new THREE.Vector3(
            camera.position[0],
            camera.position[1], 
            camera.position[2]
          );
          
          const distance = point.distanceTo(cameraPos);
          if (distance <= maxDistance) {
            nearbyCameras.push({ camera, index, distance });
          }
        });
        
        // Sort by distance and take closest 3-5 cameras
        nearbyCameras.sort((a, b) => a.distance - b.distance);
        const selectedCameras = nearbyCameras.slice(0, 5);
        
        console.log(`Found ${selectedCameras.length} cameras within ${maxDistance} units`);
        
        // Show only these cameras
        if (cameraOverlay.showSelectedCameras) {
          const cameraIndices = selectedCameras.map(item => item.index);
          cameraOverlay.showSelectedCameras(cameraIndices);
        }
        
        // Update UI
        const selectionInfo = document.getElementById('selectionInfo');
        selectionInfo.textContent = `Showing ${selectedCameras.length} cameras near clicked point`;
        selectionInfo.style.display = 'block';
        
        // Update camera list to highlight selected
        updateCameraListWithSelection(selectedCameras.map(item => item.index));
      }
      
      console.log('Camera panel initialized with click-to-query functionality');
    }

    /**
     * Load camera data from URL
     */
    async function loadCameraDataFromURL(url) {
      try {
        document.getElementById('cameraStats').textContent = 'Loading cameras...';
        
        const cameras = await cameraOverlay.loadCameraData(url);
        updateCameraList(cameras);
        
        document.getElementById('cameraStats').textContent = 
          `Loaded ${cameras.length} cameras`;
          
        console.log(`Successfully loaded ${cameras.length} cameras from ${url}`);
      } catch (error) {
        console.error('Error loading camera data:', error);
        document.getElementById('cameraStats').textContent = 
          `Error: ${error.message}`;
      }
    }

    /**
     * Load camera data from local file
     */
    function loadCameraDataFromFile(file) {
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          document.getElementById('cameraStats').textContent = 'Processing file...';
          
          let cameras;
          if (file.name.endsWith('.json')) {
            cameras = JSON.parse(e.target.result);
            cameraOverlay.cameras = cameras;
            cameraOverlay.createCameraFrustums();
          } else if (file.name.endsWith('.xml')) {
            cameras = cameraOverlay.parseXMLCameraData(e.target.result);
            cameraOverlay.cameras = cameras;
            cameraOverlay.createCameraFrustums();
          } else {
            throw new Error('Unsupported file format. Use .xml or .json');
          }
          
          updateCameraList(cameras);
          document.getElementById('cameraStats').textContent = 
            `Loaded ${cameras.length} cameras from file`;
            
        } catch (error) {
          console.error('Error processing camera file:', error);
          document.getElementById('cameraStats').textContent = 
            `Error: ${error.message}`;
        }
      };
      reader.readAsText(file);
    }

    /**
     * Update camera list in panel
     */
    function updateCameraList(cameras) {
      const cameraList = document.getElementById('cameraList');
      cameraList.innerHTML = '';

      cameras.forEach((camera, index) => {
        const item = document.createElement('div');
        item.className = 'camera-item';
        item.textContent = `${index + 1}. ${camera.label || camera.id || `Camera ${index}`}`;
        item.onclick = () => {
          // Remove previous active
          document.querySelectorAll('.camera-item.active').forEach(el => {
            el.classList.remove('active');
          });
          
          // Set this as active
          item.classList.add('active');
          
          // Fly to camera
          cameraOverlay.flyToCamera(index);
          
          console.log(`Selected camera ${index}: ${camera.label || camera.id}`);
        };
        
        cameraList.appendChild(item);
      });
    }

    /**
     * Keyboard shortcuts
     */
    document.addEventListener('keydown', (e) => {
      if (!cameraOverlay || !cameraOverlay.cameras.length) return;
      
      // Number keys 1-9 to jump to cameras
      if (e.key >= '1' && e.key <= '9') {
        const cameraIndex = parseInt(e.key) - 1;
        if (cameraIndex < cameraOverlay.cameras.length) {
          cameraOverlay.flyToCamera(cameraIndex);
          
          // Update UI
          document.querySelectorAll('.camera-item.active').forEach(el => {
            el.classList.remove('active');
          });
          const item = document.querySelector(`.camera-item:nth-child(${cameraIndex + 1})`);
          if (item) item.classList.add('active');
        }
      }
      
      // 'C' to toggle cameras
      if (e.key.toLowerCase() === 'c' && e.ctrlKey) {
        e.preventDefault();
        document.getElementById('btnToggleFrustums').click();
      }
      
      // 'I' to toggle image plane
      if (e.key.toLowerCase() === 'i' && e.ctrlKey) {
        e.preventDefault();
        document.getElementById('btnToggleImagePlane').click();
      }
    });

    // Monitor for camera animations created by the user
    function monitorCameraAnimations() {
      if (!window.viewer || !window.viewer.scene) {
        setTimeout(monitorCameraAnimations, 500);
        return;
      }
      
      console.log('Monitoring for user-created camera animations...');
      
      // Check periodically for camera animations
      const checkAnimations = () => {
        if (viewer.scene && viewer.scene.cameraAnimations && viewer.scene.cameraAnimations.length > 0) {
          const animation = viewer.scene.cameraAnimations[0];
          if (animation !== window.cameraAnimation) {
            window.cameraAnimation = animation;
            console.log('Camera animation detected and stored globally');
            console.log('Animation has', animation.controlPoints ? animation.controlPoints.length : 0, 'control points');
          }
        }
        setTimeout(checkAnimations, 2000);
      };
      
      checkAnimations();
    }

    // Make functions available globally (for backwards compatibility)
    window.saveCameraTrack = function(animation) {
      const qs = new URLSearchParams(location.search);
      const src = qs.get('src');
      const title = qs.get('title') || 'Enhanced SFM Point Cloud';
      
      try {
        const trackData = {
          version: "1.0",
          created: new Date().toISOString(),
          title: title || "Camera Track",
          pointCloudSrc: src,
          duration: animation.duration || 10,
          controlPoints: []
        };

        // Export all control points
        for (let i = 0; i < animation.controlPoints.length; i++) {
          const cp = animation.controlPoints[i];
          trackData.controlPoints.push({
            index: i,
            position: cp.position.toArray(),
            target: cp.target.toArray(),
            time: cp.time || (i / (animation.controlPoints.length - 1))
          });
        }

        // Create and download the file
        const blob = new Blob([JSON.stringify(trackData, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${(title || 'camera-track').replace(/\s+/g, '-').toLowerCase()}-${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        console.log('Camera track saved successfully');
        alert(`Camera track saved with ${trackData.controlPoints.length} keyframes`);
      } catch (error) {
        console.error('Error saving camera track:', error);
        alert('Error saving camera track: ' + error.message);
      }
    };

    window.loadCameraTrack = function(animation, file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const trackData = JSON.parse(e.target.result);
          
          // Check if this is a camera track file (with controlPoints) or single camera position
          if (trackData.controlPoints && Array.isArray(trackData.controlPoints)) {
            // This is a proper camera track file
            console.log('Loading camera track with', trackData.controlPoints.length, 'keyframes');
            
            // Clear existing control points
            window.clearCameraTrack(animation);

            // Load control points
            for (const cpData of trackData.controlPoints) {
              if (cpData.position && cpData.target && cpData.position.length === 3 && cpData.target.length === 3) {
                const cp = animation.createControlPoint();
                cp.position.fromArray(cpData.position);
                cp.target.fromArray(cpData.target);
                if (cpData.time !== undefined) {
                  cp.time = cpData.time;
                }
              }
            }

            // Set duration if available
            if (trackData.duration) {
              animation.duration = trackData.duration;
            }

            console.log('Camera track loaded successfully');
            alert(`Camera track loaded with ${trackData.controlPoints.length} keyframes`);
            
            // Reset animation to beginning
            animation.set(0);
            
          } else if (trackData.position && trackData.target) {
            // This looks like a single camera position file - convert it to a single keyframe
            console.log('Converting single camera position to keyframe');
            
            if (confirm('This appears to be a single camera position. Create a single keyframe from this position?')) {
              // Clear existing control points
              window.clearCameraTrack(animation);
              
              // Create single keyframe from the camera position
              const cp = animation.createControlPoint();
              if (Array.isArray(trackData.position) && trackData.position.length === 3) {
                cp.position.fromArray(trackData.position);
              }
              if (Array.isArray(trackData.target) && trackData.target.length === 3) {
                cp.target.fromArray(trackData.target);
              }
              
              console.log('Single camera position converted to keyframe');
              alert('Single camera position loaded as keyframe');
              
              // Reset animation to beginning
              animation.set(0);
            } else {
              alert('Use the sidebar "Load Camera" button for single camera positions');
            }
            
          } else {
            throw new Error('Invalid file format - missing controlPoints array or camera position data');
          }
          
        } catch (error) {
          console.error('Error loading camera track:', error);
          alert('Error loading camera track: ' + error.message);
        }
      };
      reader.readAsText(file);
    };

    window.clearCameraTrack = function(animation) {
      try {
        // Remove all control points
        const controlPoints = [...animation.controlPoints]; // Create a copy to avoid modification during iteration
        for (const cp of controlPoints) {
          animation.removeControlPoint(cp);
        }
        
        // Reset animation
        animation.set(0);
        animation.stop();
        
        console.log('Camera track cleared');
      } catch (error) {
        console.error('Error clearing camera track:', error);
        alert('Error clearing camera track: ' + error.message);
      }
    };

    window.initializeSidebarExports = function() {
      const qs = new URLSearchParams(location.search);
      const src = qs.get('src');
      const title = qs.get('title') || 'Enhanced SFM Point Cloud';
      
      // Wait for sidebar to be fully loaded
      const checkSidebar = () => {
        const btnScreenshot = document.getElementById('btnExportScreenshot');
        const btnCamera = document.getElementById('btnExportCamera');
        const btnMeasurements = document.getElementById('btnExportMeasurements');
        const btnShareLink = document.getElementById('btnShareLink');
        const btnLoadCamera = document.getElementById('btnLoadCamera');
        const btnSaveTrack = document.getElementById('btnSaveTrack');
        const btnLoadTrack = document.getElementById('btnLoadTrack');
        const cameraFileInput = document.getElementById('cameraFileInput');
        const trackFileInput = document.getElementById('trackFileInput');

        if (btnScreenshot && btnCamera && btnMeasurements && btnShareLink && btnLoadCamera && cameraFileInput) {
          // Screenshot export
          btnScreenshot.onclick = () => {
            try {
              const dataURL = viewer.renderer.domElement.toDataURL('image/png');
              const a = document.createElement('a');
              a.href = dataURL;
              a.download = (title || 'enhanced-sfm-screenshot') + '.png';
              document.body.appendChild(a);
              a.click();
              a.remove();
            } catch (err) {
              alert('Screenshot failed. Some browsers require special flags for WebGL capture.');
              console.error(err);
            }
          };

          // Camera export
          btnCamera.onclick = () => {
            const cameraData = window.getCameraState();
            const blob = new Blob([JSON.stringify(cameraData, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = (title || 'camera') + '.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
          };

          // Measurements export
          btnMeasurements.onclick = () => {
            try {
              const out = [];
              const ms = (viewer.measuringTool.measurements || viewer.measuringTool.measures || []);
              for (const m of ms) {
                const pts = (m.points || []).map(p => p.position.toArray());
                out.push({ name: m.name || 'Measure', closed: !!m.closed, points: pts });
              }
              const blob = new Blob([JSON.stringify({ measurements: out }, null, 2)], {type: 'application/json'});
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = (title || 'measurements') + '.json';
              document.body.appendChild(a);
              a.click();
              a.remove();
            } catch (err) {
              alert('No measurements found or export failed.');
              console.error(err);
            }
          };

          // Share link
          btnShareLink.onclick = async () => {
            const u = new URL(location.href.split('?')[0], location.href);
            const params = new URLSearchParams();
            
            // Only add parameters if they differ from defaults
            if (src && src !== defaultSrc) params.set('src', src);
            if (title !== 'OCC-ASC-003 Enhanced SFM Point Cloud') params.set('title', title);
            if (cameraSrc && cameraSrc !== defaultCameraSrc) params.set('cameras', cameraSrc);
            if (imageBase && imageBase !== defaultImageBase) params.set('imageBase', imageBase);
            
            u.search = params.toString();
            try {
              await navigator.clipboard.writeText(u.toString());
              alert('OCC-ASC-003 Enhanced SFM Viewer link copied to clipboard');
            } catch {
              prompt('Copy link:', u.toString());
            }
          };

          // Load camera
          btnLoadCamera.onclick = () => {
            cameraFileInput.click();
          };

          cameraFileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (e) => {
                try {
                  const cameraData = JSON.parse(e.target.result);
                  window.setCameraState(cameraData);
                  alert('Camera position loaded successfully');
                } catch (err) {
                  alert('Invalid camera file: ' + err.message);
                }
              };
              reader.readAsText(file);
            }
          };

          // Save camera track (only available if animation exists)
          if (btnSaveTrack) {
            btnSaveTrack.onclick = () => {
              console.log('Save Track button clicked from sidebar');
              console.log('window.cameraAnimation exists:', !!window.cameraAnimation);
              if (window.cameraAnimation) {
                console.log('Control points:', window.cameraAnimation.controlPoints.length);
                window.saveCameraTrack(window.cameraAnimation);
              } else {
                alert('No camera animation available. Camera tracks are only available in SFM viewer mode.');
              }
            };
          }

          // Load camera track
          if (btnLoadTrack && trackFileInput) {
            btnLoadTrack.onclick = () => {
              trackFileInput.click();
            };
            
            trackFileInput.onchange = (e) => {
              const file = e.target.files[0];
              if (file) {
                if (window.cameraAnimation) {
                  console.log('Loading track into camera animation');
                  window.loadCameraTrack(window.cameraAnimation, file);
                } else {
                  alert('No camera animation available. Load this file using "Load Camera" for single camera position, or use the SFM viewer for camera tracks.');
                }
              }
            };
          }

        } else {
          // Retry after a short delay
          setTimeout(checkSidebar, 100);
        }
      };

      checkSidebar();
    };

    window.getCameraState = function() {
      try {
        const v = viewer.scene.view;
        const cam = viewer.scene.getActiveCamera();
        
        // Get pivot/target - try multiple methods
        let target = [0, 0, 0];
        if (v.getPivot) {
          const pivot = v.getPivot();
          target = pivot.toArray ? pivot.toArray() : [pivot.x, pivot.y, pivot.z];
        } else if (v.pivot) {
          target = v.pivot.toArray ? v.pivot.toArray() : [v.pivot.x, v.pivot.y, v.pivot.z];
        }
        
        const cameraState = {
          position: cam.position.toArray(),
          target: target,
          fov: cam.fov || v.fov || 60
        };
        
        // Add view-specific properties if available
        if (v.yaw !== undefined) cameraState.yaw = v.yaw;
        if (v.pitch !== undefined) cameraState.pitch = v.pitch;
        if (v.radius !== undefined) cameraState.radius = v.radius;
        
        return cameraState;
      } catch (error) {
        console.error('Error getting camera state:', error);
        // Fallback - just get basic camera info
        const cam = viewer.scene.getActiveCamera();
        return {
          position: cam.position.toArray(),
          target: [0, 0, 0],
          fov: cam.fov || 60
        };
      }
    };

    window.setCameraState = function(state) {
      try {
        console.log('Setting camera state:', state);
        const v = viewer.scene.view;
        const cam = viewer.scene.getActiveCamera();
        
        // Set position first
        if (state.position && Array.isArray(state.position) && state.position.length === 3) {
          cam.position.set(state.position[0], state.position[1], state.position[2]);
          console.log('Camera position set to:', state.position);
        }
        
        // Set FOV
        if (typeof state.fov === 'number') {
          cam.fov = state.fov;
          cam.updateProjectionMatrix();
          console.log('Camera FOV set to:', state.fov);
        }
        
        // Set view properties (yaw, pitch, radius) - these are Potree-specific
        if (typeof state.yaw === 'number' && v.yaw !== undefined) {
          v.yaw = state.yaw;
          console.log('View yaw set to:', state.yaw);
        }
        if (typeof state.pitch === 'number' && v.pitch !== undefined) {
          v.pitch = state.pitch;
          console.log('View pitch set to:', state.pitch);
        }
        if (typeof state.radius === 'number' && v.radius !== undefined) {
          v.radius = state.radius;
          console.log('View radius set to:', state.radius);
        }
        
        // Set target/pivot - try multiple approaches
        if (state.target && Array.isArray(state.target) && state.target.length === 3) {
          const targetVector = new THREE.Vector3(state.target[0], state.target[1], state.target[2]);
          
          // Try Potree's view methods first
          if (v.lookAt) {
            v.lookAt(targetVector);
            console.log('Used view.lookAt for target:', state.target);
          } else if (v.setPivot) {
            v.setPivot(targetVector);
            console.log('Used view.setPivot for target:', state.target);
          } else {
            // Fallback to camera lookAt
            cam.lookAt(targetVector);
            console.log('Used camera.lookAt for target:', state.target);
          }
        }
        
        // Force update and render
        if (v.update) {
          v.update();
        }
        
        // Ensure the renderer updates
        if (viewer.setNeedsRedraw) {
          viewer.setNeedsRedraw();
        }
        
        // Alternative: force immediate render
        if (viewer.render) {
          viewer.render();
        }
        
        console.log('Camera state applied successfully');
        
      } catch (error) {
        console.error('Error in main setCameraState:', error);
        
        // Comprehensive fallback approach
        try {
          console.log('Attempting fallback camera positioning...');
          const cam = viewer.scene.getActiveCamera();
          
          if (state.position && Array.isArray(state.position) && state.position.length === 3) {
            cam.position.set(state.position[0], state.position[1], state.position[2]);
          }
          
          if (state.target && Array.isArray(state.target) && state.target.length === 3) {
            cam.lookAt(new THREE.Vector3(state.target[0], state.target[1], state.target[2]));
          }
          
          if (typeof state.fov === 'number') {
            cam.fov = state.fov;
            cam.updateProjectionMatrix();
          }
          
          // Force render
          if (viewer.setNeedsRedraw) {
            viewer.setNeedsRedraw();
          } else if (viewer.render) {
            viewer.render();
          }
          
          console.log('Fallback camera positioning successful');
          
        } catch (fallbackError) {
          console.error('Fallback camera setting failed:', fallbackError);
          throw new Error('Could not set camera position - both main and fallback methods failed');
        }
      }
    };
  </script>
</body>
